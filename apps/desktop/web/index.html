<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offish</title>
  <link rel="stylesheet" href="offish.css">
</head>
<body>
  <header>
    <strong>Offish</strong>
    <div class="menu-bar" data-focus-zone="menu" aria-label="Application menus">
      <button id="file-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="floating-menu">File</button>
      <button id="edit-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="floating-menu">Edit</button>
    </div>
    <span id="status" role="status"></span>
  </header>
  <section id="workspace-home" aria-label="Workspaces" hidden>
    <div class="workspace-picker">
      <button id="create-workspace" type="button">Create Workspace</button>
      <div id="saved-workspaces" hidden></div>
    </div>
  </section>
  <div id="workspace-layout" class="workspace" hidden>
    <nav id="files-pane" data-focus-zone="files" tabindex="-1" aria-label="Workspace files">
      <h2>Files</h2>
      <div class="workspace-name">
        <p id="folder">No folder open</p>
        <button id="workspace-rename" type="button" class="icon-button" title="Rename workspace" aria-label="Rename workspace">
          <span aria-hidden="true">✎</span>
        </button>
      </div>
      <div id="files-scroll"><ul id="files"></ul></div>
      <button id="trash-open" type="button">Trash</button>
    </nav>
    <div id="files-divider" data-focus-zone="files-divider" class="pane-divider" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize Files pane" aria-controls="files-pane"></div>
    <main id="editor-pane" data-focus-zone="editor" tabindex="-1" aria-label="Document editor">
      <div id="editor-tabs" hidden>
        <div id="tabs" aria-label="Open documents"></div>
        <button id="markdown-preview" type="button" aria-pressed="true" title="Switch between live preview and Markdown source" hidden>Live preview</button>
      </div>
      <div id="editor">Select a file.</div>
    </main>
    <div id="details-divider" data-focus-zone="details-divider" class="pane-divider" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize Details pane" aria-controls="details-pane"></div>
    <aside id="details-pane" data-focus-zone="details" aria-label="Document details">
      <h2>Details</h2>
      <p id="details">Select a document.</p>
      <section id="recovery" hidden>
        <h3>Interrupted save</h3>
        <button id="recover">Load recovered draft</button>
        <button id="discard">Discard recovered draft</button>
      </section>
      <section id="conflict" hidden>
        <h3>File changed on disk</h3>
        <p id="conflict-message">Your draft is kept in the editor. Compare it with the disk version below.</p>
        <label for="disk">Disk version</label>
        <textarea id="disk" readonly rows="10"></textarea>
        <button id="reload">Use disk version</button>
        <button id="keep">Keep draft and save</button>
      </section>
    </aside>
  </div>
  <dialog id="entry-dialog" aria-labelledby="entry-heading">
    <form id="entry-form">
      <h2 id="entry-heading"></h2>
      <p id="entry-description" hidden></p>
      <div id="entry-field">
        <label id="entry-label" for="entry-name">Name</label>
        <input id="entry-name" required autocomplete="off" aria-describedby="entry-description">
      </div>
      <p id="entry-error" role="alert" hidden></p>
      <div class="entry-buttons">
        <button id="entry-cancel" type="button">Cancel</button>
        <button id="entry-submit" type="submit">Create</button>
      </div>
    </form>
  </dialog>
  <dialog id="trash-dialog" aria-labelledby="trash-heading">
    <h2 id="trash-heading">Workspace Trash</h2>
    <p id="trash-status" role="status"></p>
    <ul id="trash-files"></ul>
    <button id="trash-close">Close</button>
  </dialog>
  <dialog id="search-dialog" aria-labelledby="search-heading">
    <h2 id="search-heading">Find in Workspace</h2>
    <p id="search-scope"></p>
    <form id="search-form">
      <label for="search-query">Text to find</label>
      <input id="search-query" type="search" maxlength="512" autocomplete="off">
      <button id="search-submit" type="submit">Search</button>
      <button id="search-rebuild" type="submit">Rebuild Index</button>
      <button id="search-close" type="button">Close</button>
    </form>
    <p id="search-status" role="status"></p>
    <ul id="search-results" aria-label="Search matches"></ul>
  </dialog>
  <div id="floating-menu" class="floating-menu" role="menu" tabindex="-1" hidden></div>
  <script type="module" src="editor.js"></script>
</body>
</html>
